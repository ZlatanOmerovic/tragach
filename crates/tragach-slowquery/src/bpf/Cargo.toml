[package]
name = "tragach-slowquery-ebpf"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[[bin]]
name = "tragach-slowquery"
path = "main.rs"

[dependencies]
aya-ebpf = "=0.1.1"
aya-log-ebpf = "=0.1.0"
tragach-common = { path = "../../../tragach-common", default-features = false }

[profile.dev]
opt-level = 3
debug = false
panic = "abort"
overflow-checks = false

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1

# Marks this manifest as its own workspace root. The parent Cargo.toml lists
# `crates/tragach-slowquery/src/bpf` under `workspace.exclude`, but cargo still
# discovers the parent unless we explicitly declare a new root here.
[workspace]
